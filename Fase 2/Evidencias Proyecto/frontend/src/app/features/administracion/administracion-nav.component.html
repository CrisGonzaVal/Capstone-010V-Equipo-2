<nav
  role="tablist"
  aria-label="Secciones de administración institucional"
  class="mb-6 flex flex-wrap gap-1 border-b border-slate-200"
  (keydown)="alNavegarPestanas($event)"
>
  @for (enlace of enlaces; track enlace.ruta) {
    <a
      [id]="identificador(enlace)"
      role="tab"
      [routerLink]="enlace.ruta"
      [attr.aria-selected]="esActivo(enlace) ? 'true' : 'false'"
      [attr.tabindex]="esActivo(enlace) ? 0 : -1"
      class="-mb-px border-b-2 px-4 py-2 text-sm font-medium transition-colors hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
      [class.border-blue-600]="esActivo(enlace)"
      [class.text-blue-700]="esActivo(enlace)"
      [class.border-transparent]="!esActivo(enlace)"
      [class.text-slate-600]="!esActivo(enlace)"
    >
      {{ enlace.etiqueta }}
    </a>
  }
</nav>
