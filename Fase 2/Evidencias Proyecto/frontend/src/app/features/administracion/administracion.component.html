<div class="mx-auto max-w-5xl space-y-6">
  <header>
    <h2 class="text-2xl font-bold text-slate-800">Administración institucional</h2>
    <p class="text-sm text-slate-500">
      Gestiona las sedes, departamentos, usuarios y encargados de tu institución. El
      ámbito lo resuelve el servidor desde tu sesión.
    </p>
  </header>

  <app-administracion-nav />

  <!--
    Panel único de la navegación por pestañas (enmienda T-17, AC-17): envuelve el
    outlet y se etiqueta con la pestaña de la ruta vigente. La sección activa se
    deriva de la misma resolución de `Router.url` que usa la barra.
  -->
  <div
    role="tabpanel"
    id="panel-administracion"
    [attr.aria-labelledby]="'pestana-administracion-' + seccionActiva()"
  >
    <router-outlet />
  </div>
</div>
