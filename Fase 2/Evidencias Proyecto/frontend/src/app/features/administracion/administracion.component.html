<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-800">Administración y Roles</h2>
    <p class="text-sm text-slate-500">
      Gestión multi-tenant de instituciones, usuarios y permisos
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (rol of roles; track rol.nombre) {
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-slate-800 text-lg">{{ rol.nombre }}</h3>
          <span
            class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold"
          >
            Activo
          </span>
        </div>

        <p class="text-sm text-slate-500">{{ rol.descripcion }}</p>

        <div class="space-y-2 pt-2 border-t border-slate-100 text-sm">
          @for (permiso of rol.permisos; track permiso.etiqueta) {
            <div class="flex justify-between items-center">
              <span class="text-slate-600">{{ permiso.etiqueta }}</span>
              <input
                type="checkbox"
                [checked]="permiso.activo"
                [attr.aria-label]="'Permiso: ' + permiso.etiqueta"
                class="accent-blue-600 h-4 w-4"
              />
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
