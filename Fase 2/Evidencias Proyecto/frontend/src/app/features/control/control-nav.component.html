<nav
  aria-label="Secciones del portal de control"
  class="mb-6 flex flex-wrap gap-2 border-b border-slate-200 pb-3"
>
  @for (enlace of enlaces; track enlace.ruta) {
    <a
      [routerLink]="enlace.ruta"
      routerLinkActive="bg-slate-800 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
    >
      {{ enlace.etiqueta }}
    </a>
  }
</nav>
